<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>SSXNG</title>
    <link href="/main.css" rel="stylesheet"/>
</head>

<body>
<div class="app" id="app">

    <!-- 窗口顶部标题栏：固定高度、可拖动（--wails-draggable: drag）。
         里面不放任何交互元素：该 CSS 自定义属性会继承，放了会吞掉点击。 -->
    <div aria-hidden="true" class="titlebar"></div>

    <!-- ================= 左侧竖排标签导航 ================= -->
    <aside class="sidebar">
        <div class="brand">
            <svg aria-hidden="true" class="brand-ico" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="1.7" viewBox="0 0 24 24">
                <path d="M12 3l8 3v6c0 5-3.4 8.2-8 9.9C7.4 20.2 4 17 4 12V6z"/>
                <path d="M8.5 12.4l2.6 2.6 4.6-5"/>
            </svg>
            <span class="brand-text">
                <b>SSXNG</b>
                <small data-i18n="app.subtitle"></small>
            </span>
        </div>

        <nav aria-orientation="vertical" class="nav" id="nav" role="tablist">
            <button aria-selected="false" class="nav-btn" data-act="nav" data-view="status" role="tab" type="button">
                <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                     stroke-width="1.7" viewBox="0 0 24 24">
                    <path d="M3 12h4l2.5-7 4 14 2.5-7H21"/>
                </svg>
                <span data-i18n="nav.status"></span>
            </button>
            <button aria-selected="false" class="nav-btn" data-act="nav" data-view="servers" role="tab" type="button">
                <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                     stroke-width="1.7" viewBox="0 0 24 24">
                    <rect height="6.5" rx="2" width="18" x="3" y="4"/>
                    <rect height="6.5" rx="2" width="18" x="3" y="13.5"/>
                    <path d="M7 7.25h.01M7 16.75h.01"/>
                </svg>
                <span data-i18n="nav.servers"></span>
            </button>
            <button aria-selected="false" class="nav-btn" data-act="nav" data-view="modes" role="tab" type="button">
                <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                     stroke-width="1.7" viewBox="0 0 24 24">
                    <path d="M4 7h5M13 7h7M4 17h7M15 17h5"/>
                    <circle cx="11" cy="7" r="2"/>
                    <circle cx="13" cy="17" r="2"/>
                </svg>
                <span data-i18n="nav.modes"></span>
            </button>
            <button aria-selected="false" class="nav-btn" data-act="nav" data-view="pac" role="tab" type="button">
                <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                     stroke-width="1.7" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="8.5"/>
                    <path d="M3.5 12h17"/>
                    <path d="M12 3.5c2.4 2.4 3.7 5.4 3.7 8.5S14.4 18.1 12 20.5C9.6 18.1 8.3 15.1 8.3 12S9.6 5.9 12 3.5z"/>
                </svg>
                <span data-i18n="nav.pac"></span>
            </button>
            <button aria-selected="false" class="nav-btn" data-act="nav" data-view="logs" role="tab" type="button">
                <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                     stroke-width="1.7" viewBox="0 0 24 24">
                    <path d="M5 4h9.5L19 8.5V20H5z"/>
                    <path d="M8.5 9.5h7M8.5 13h7M8.5 16.5h4"/>
                </svg>
                <span data-i18n="nav.logs"></span>
            </button>
            <button aria-selected="false" class="nav-btn" data-act="nav" data-view="diag" role="tab" type="button">
                <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                     stroke-width="1.7" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="8.5"/>
                    <path d="M8 12.4l2.8 2.8L16 9.6"/>
                </svg>
                <span data-i18n="nav.diag"></span>
            </button>
        </nav>

        <div class="sidebar-foot">
            <div class="mini-traffic">
                <span class="mini" title="upload">
                    <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"
                         stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
                        <path d="M12 19V5"/><path d="M6 11l6-6 6 6"/>
                    </svg>
                    <em id="mini-up">0 B/s</em>
                </span>
                <span class="mini" title="download">
                    <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"
                         stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
                        <path d="M12 5v14"/><path d="M6 13l6 6 6-6"/>
                    </svg>
                    <em id="mini-down">0 B/s</em>
                </span>
            </div>
            <div class="version">
                <span data-i18n="app.version"></span>
                <b id="app-version">—</b>
            </div>
        </div>
    </aside>

    <!-- ================= 主区域 ================= -->
    <main class="main" id="main">
        <div class="offline" hidden id="offline">
            <svg aria-hidden="true" class="offline-ico" fill="none" stroke="currentColor" stroke-linecap="round"
                 stroke-linejoin="round" stroke-width="1.7" viewBox="0 0 24 24">
                <path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/>
            </svg>
            <div class="offline-text">
                <b data-i18n="backend.notReadyTitle"></b>
                <p data-i18n="backend.notReadyBody"></p>
                <p class="mono muted" id="offline-detail"></p>
            </div>
            <button class="btn btn-primary" data-act="retry-backend" type="button">
                <span data-i18n="backend.retry"></span>
            </button>
        </div>

        <section class="view" data-view="status" id="view-status">
            <header class="view-head">
                <h1 data-i18n="status.title"></h1>
                <p data-i18n="status.subtitle"></p>
            </header>
            <div class="view-body" id="body-status"></div>
        </section>

        <section class="view" data-view="servers" hidden id="view-servers">
            <header class="view-head">
                <h1 data-i18n="servers.title"></h1>
                <p data-i18n="servers.subtitle"></p>
            </header>
            <div class="view-body" id="body-servers"></div>
        </section>

        <section class="view" data-view="modes" hidden id="view-modes">
            <header class="view-head">
                <h1 data-i18n="modes.title"></h1>
                <p data-i18n="modes.subtitle"></p>
            </header>
            <div class="view-body" id="body-modes"></div>
        </section>

        <section class="view" data-view="pac" hidden id="view-pac">
            <header class="view-head">
                <h1 data-i18n="pac.title"></h1>
                <p data-i18n="pac.subtitle"></p>
            </header>
            <div class="view-body" id="body-pac"></div>
        </section>

        <section class="view" data-view="logs" hidden id="view-logs">
            <header class="view-head">
                <h1 data-i18n="logs.title"></h1>
                <p data-i18n="logs.subtitle"></p>
            </header>
            <div class="view-body" id="body-logs"></div>
        </section>

        <section class="view" data-view="diag" hidden id="view-diag">
            <header class="view-head">
                <h1 data-i18n="diag.title"></h1>
                <p data-i18n="diag.subtitle"></p>
            </header>
            <div class="view-body" id="body-diag"></div>
        </section>
    </main>

    <!-- ================= 底部浮层提示 ================= -->
    <div aria-live="polite" class="toasts" id="toasts"></div>
</div>

<script defer src="/i18n.js"></script>
<script defer src="/app.js"></script>
</body>
</html>
